name: Bug Report
description: Report a bug found during testing
title: "[BUG][Module]: "
labels: ["type: bug", "status: new"]
body:
  - type: input
    id: test_case
    attributes:
      label: Found by Test Case
      placeholder: "TC-LOGIN-003"
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Requirement Related
      placeholder: "FR-02"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - Critical
        - Major
        - Minor
        - Trivial
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Browser, OS, URL, version/commit, test account"
      placeholder: |
        - Browser: Chrome 120
        - OS: Windows 11
        - URL: https://...
        - Version/Commit: abc123
        - Test Account: user@test.com
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      placeholder: What should happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      placeholder: What actually happened
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Screenshot, video, console log, or network response"
      placeholder: "(Attach evidence here)"
    validations:
      required: false
