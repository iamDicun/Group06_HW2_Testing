name: API Tests - Pass (All passing)

on:
  push:
    branches: [ HW6-23127031 ]

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman + HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Clone SUT (eShop backend - fixed version)
        run: |
          git clone -b hw06-pass https://github.com/nguyenngoc-minhchau/eshop-sut.git /tmp/eshop-sut
          cd /tmp/eshop-sut/backend
          npm install

      - name: Start SUT (backend) in background
        run: |
          cd /tmp/eshop-sut/backend
          node server.js &
          sleep 3
          curl -s http://localhost:3000/api/products > /dev/null && echo "SUT is running" || echo "SUT failed to start"

      - name: Run Postman collection with Newman
        run: |
          mkdir -p newman-report
          newman run 23127031_HW06_AI_API_090/HW06_collection.json \
            -e 23127031_HW06_AI_API_090/HW06_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/report.html \
            --reporter-htmlextra-title "HW06 API Test Report - Pass" || true

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report-pass
          path: newman-report/
