name: EShop API Automated Testing (Newman)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend dependencies
        working-directory: ./application/backend
        run: npm ci || npm install

      - name: Start Backend Server
        working-directory: ./application/backend
        run: |
          node server.js &
          sleep 3

      - name: Verify Backend Health
        run: |
          curl -f http://localhost:3000/api/products || exit 1

      - name: Install Newman and HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman Test Suite
        run: |
          mkdir -p ./submission/reports
          newman run ./tests/test-runs/EShop_API_Testing.postman_collection.json \
            -e ./tests/test-runs/eshop-api.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./submission/reports/EShop_API_Test_Report.html \
            --reporter-htmlextra-title "EShop API Test Report (CI/CD Pipeline)" \
            --delay-request 30 \
            --suppress-exit-code

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: ./submission/reports/EShop_API_Test_Report.html
