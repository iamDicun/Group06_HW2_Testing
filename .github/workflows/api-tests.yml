name: HW06 AI API Tests - EShop (FR-05/FR-11/FR-17)

on:
  push:
    branches: [ "HW06-23127459" ]
  pull_request:
    branches: [ "HW06-23127459" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: |
            application/package-lock.json
            application/backend/package-lock.json

      - name: Cài đặt dependencies backend
        working-directory: application/backend
        run: npm ci || npm install

      - name: Khởi động backend SUT ở background
        working-directory: application/backend
        run: |
          echo "Kiểm tra lệnh khởi động có sẵn..."
          if npm run | grep -q " dev"; then
            echo "Dùng npm run dev"
            nohup npm run dev > ../../backend.log 2>&1 &
          elif [ -f "server.js" ]; then
            echo "Không có npm run dev, dùng node server.js trực tiếp"
            nohup node server.js > ../../backend.log 2>&1 &
          else
            echo "Không tìm thấy server.js, thử npm start"
            nohup npm start > ../../backend.log 2>&1 &
          fi
          echo $! > ../../backend.pid
          cat ../../backend.pid
          sleep 2
          echo "Xem log khởi động (10 dòng đầu):"
          head -20 ../../backend.log || cat ../../backend.log | head -20
          echo "Kiểm tra tiến trình:"
          ps aux | grep -E "node.*server" | grep -v grep || ps -ef | grep node | head -5
        env:
          PORT: 3000

      - name: Đợi server sẵn sàng ở localhost:3000
        run: |
          echo "Đợi backend khởi động (tối đa 90 giây)..."
          # Thử wait-on với http-get (GET thay vì HEAD) để tránh lỗi với endpoint chỉ hỗ trợ GET
          npx --yes wait-on http-get://localhost:3000/api/products --timeout 60000 --interval 1000 --verbose && echo "wait-on thành công" || \
          (echo "wait-on thất bại hoặc timeout, chuyển sang curl retry loop..." && \
           for i in $(seq 1 45); do \
             HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products || echo "000"); \
             if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then echo "Server đã phản hồi với mã $HTTP_CODE sau $i lần thử - coi như sẵn sàng"; break; fi; \
             echo "Chờ $i/45... (mã: $HTTP_CODE)"; sleep 2; \
             if [ $i -eq 15 ]; then echo "--- Log backend sau 30s ---"; cat backend.log | head -50; echo "--- Tiến trình Node ---"; ps aux | grep node | grep -v grep || true; fi; \
           done; \
           FINAL_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/products || echo "000"); \
           if [ "$FINAL_CODE" = "000" ]; then echo "Server không phản hồi sau 90s"; echo "=== backend.log ==="; cat backend.log; echo "=== ps ==="; ps aux | grep node | grep -v grep || true; exit 1; else echo "Server sẵn sàng với mã $FINAL_CODE"; fi)

      - name: Cài Newman và reporter htmlextra
        run: |
          npm install -g newman newman-reporter-htmlextra
          newman --version
          # Cài thêm wait-on nếu cần (đã dùng npx ở trên)

      - name: Chạy kiểm thử API với Newman
        run: |
          npx newman run application/postman/EShop_API_Tests.postman_collection.json \
            -e application/postman/EShop_23127459.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html \
            --reporter-htmlextra-title "EShop HW06 - FR05/FR11/FR17 - MSSV 23127459" \
            --bail
          echo "Newman exit code: $?"

      - name: Tải báo cáo HTML làm artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-23127459
          path: newman-report.html
          retention-days: 7

      - name: Hiển thị tóm tắt
        if: always()
        run: |
          echo "=== Kiểm tra báo cáo ==="
          ls -lh newman-report.html || echo "Không tìm thấy report"
          echo "Pipeline sẽ FAIL (đỏ) nếu có test case fail nhờ --bail và exit code của newman"
