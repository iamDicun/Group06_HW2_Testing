name: HW06 Newman API tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd application/backend
          npm install

      - name: Start Backend Server
        run: |
          cd application/backend
          node server.js > /dev/null 2>&1 &
          sleep 3

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run API 1 (Pool A - FR-03: POST /api/forgot-password) Tests
        run: |
          newman run 23127033-HW6/api1-auth-forgot-password/forgot_password.postman_collection.json \
            --environment 23127033-HW6/postman/local.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export 23127033-HW6/api1-auth-forgot-password/reports/newman_report.json

      - name: Run API 2 (Pool B - POST /api/apply-coupon) Tests
        run: |
          newman run 23127033-HW6/api2-coupon-apply/coupon.postman_collection.json \
            --environment 23127033-HW6/postman/local.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export 23127033-HW6/api2-coupon-apply/reports/newman_report.json

      - name: Run API 3 (Pool C - PUT /api/admin/orders/:id/status) Tests
        run: |
          newman run 23127033-HW6/api3-admin-status/admin_order.postman_collection.json \
            --environment 23127033-HW6/postman/local.postman_environment.json \
            --reporters cli,json \
            --reporter-json-export 23127033-HW6/api3-admin-status/reports/newman_report.json

      - name: Upload Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw06-newman-reports
          path: |
            23127033-HW6/api1-auth-forgot-password/reports/
            23127033-HW6/api2-coupon-apply/reports/
            23127033-HW6/api3-admin-status/reports/
